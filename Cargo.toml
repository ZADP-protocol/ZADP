[workspace]
resolver = "2"
members = [
    "crates/zadp-protocol",
    "crates/zadp-zcash",
    "crates/zadp-indexer",
    "crates/zadp-api",
    "crates/zadp-payment",
    "crates/zadp-seller",
    "crates/zadp-demo",
]
default-members = ["crates/zadp-demo"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ZADP contributors"]
repository = "https://github.com/ZADP-protocol/ZADP"
version = "0.1.0"

[workspace.dependencies]
zadp-protocol = { path = "crates/zadp-protocol" }
zadp-zcash = { path = "crates/zadp-zcash" }
zadp-indexer = { path = "crates/zadp-indexer" }
zadp-api = { path = "crates/zadp-api" }
zadp-payment = { path = "crates/zadp-payment" }
zadp-seller = { path = "crates/zadp-seller" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
ciborium = "0.2"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
rust_decimal = { version = "1", features = ["serde-str"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
