[workspace]
resolver = "2"
members = [
    "crates/zap-protocol",
    "crates/zap-zcash",
    "crates/zap-indexer",
    "crates/zap-api",
    "crates/zap-payment",
    "crates/zap-seller",
    "crates/zap-demo",
]
default-members = ["crates/zap-demo"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ZAP contributors"]
repository = "https://github.com/vikoiv/ZAP"
version = "0.1.0"

[workspace.dependencies]
zap-protocol = { path = "crates/zap-protocol" }
zap-zcash = { path = "crates/zap-zcash" }
zap-indexer = { path = "crates/zap-indexer" }
zap-api = { path = "crates/zap-api" }
zap-payment = { path = "crates/zap-payment" }
zap-seller = { path = "crates/zap-seller" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
ciborium = "0.2"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
rust_decimal = { version = "1", features = ["serde-str"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
