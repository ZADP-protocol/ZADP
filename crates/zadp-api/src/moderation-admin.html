<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZADP moderation · local operator</title><style>body{background:#101715;color:#eee;font:16px system-ui;max-width:1000px;margin:auto;padding:24px}input,select,button{padding:12px;margin:6px;max-width:90%}article{border:1px solid #456;padding:16px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{background:#cafa80}label{display:block}</style><h1>Local moderation</h1><p>Use an SSH tunnel. Decisions affect hosted visibility only. Canonical chain history remains unchanged. No decision is based automatically on report count.</p><label>Admin token <input id="token" type="password" autocomplete="off"></label><button id="load">Load review queue</button><p id="message" role="status"></p><main id="queue"></main><script>
const $=id=>document.getElementById(id);async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',credentials:'omit',headers:{Authorization:'Bearer '+$('token').value,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('Request failed ('+r.status+')');return r.json();}
function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n;}function action(parent,label,fn){const b=node('button',label);b.onclick=async()=>{try{const reason=prompt('Operator decision reason');if(!reason)return;await fn(reason);$('message').textContent='Saved';await load();}catch{$('message').textContent='Decision failed';}};parent.append(b);}
async function load(){try{const data=await request('/review');$('queue').replaceChildren();for(const board of data.boards){$('queue').append(node('h2',board.board_id));for(const row of board.offers){const a=node('article','');a.append(node('h3',row.offer.title),node('pre',JSON.stringify(row,null,2)));for(const act of ['approve','hide','restore','reject'])action(a,act,reason=>request('/decisions',{board_id:board.board_id,seller:row.offer.seller,offer_id:row.offer.id,action:act,reason}));$('queue').append(a);}for(const r of board.reports){const a=node('article','');a.append(node('h3','Report '+r.report_id),node('pre',JSON.stringify(r,null,2)));const view=node('button','Review related offer');view.onclick=async()=>{try{a.append(node('pre',JSON.stringify(await request('/offer?'+new URLSearchParams({board_id:board.board_id,seller:r.seller,offer_id:r.offer_id})),null,2)));}catch{$('message').textContent='Related offer unavailable (possibly reorged)';}};a.append(view);for(const act of ['hide','restore','reject'])action(a,act,reason=>request('/decisions',{board_id:board.board_id,seller:r.seller,offer_id:r.offer_id,action:act,reason}));for(const status of ['resolved','dismissed'])action(a,status,reason=>request('/reports',{board_id:board.board_id,report_id:r.report_id,status,reason}));$('queue').append(a);}}}catch{$('message').textContent='Review unavailable or unauthorized';}}$('load').onclick=load;
</script></html>
